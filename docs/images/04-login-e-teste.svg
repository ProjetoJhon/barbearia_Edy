<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Logout e login no app, seguido do teste no terminal com 17 de 17 etapas">
  <rect width="1200" height="675" fill="#0d0e10"/>
  <rect x="24" y="24" width="1152" height="627" rx="14" fill="#15171b" stroke="#2c2e33" stroke-width="2"/>

  <!-- left: app -->
  <rect x="48" y="52" width="534" height="571" rx="12" fill="#0a0b0d" stroke="#3a3020"/>
