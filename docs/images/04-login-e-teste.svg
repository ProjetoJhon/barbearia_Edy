  <text x="240" y="278" fill="#f2f2f2" font-family="Consolas,monospace" font-size="15">trabalhojonatha@gmail.com</text>

  <rect x="78" y="316" width="474" height="54" rx="8" fill="#15171b" stroke="#3a3d44"/>
  <text x="96" y="350" fill="#8b8e95" font-family="Arial,sans-serif" font-size="15">Senha</text>
