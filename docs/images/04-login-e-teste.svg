    <text x="646" y="360" fill="#3ecf8e">OK   Admin parcial NÃO grava produto</text>
    <text x="646" y="392" fill="#3ecf8e">OK   Admin parcial NÃO lê usuários</text>
    <text x="646" y="424" fill="#3ecf8e">OK   Anônimo NÃO grava produto</text>
    <text x="646" y="456" fill="#3ecf8e">OK   Excluir produtos de teste</text>
  </g>

  <rect x="644" y="492" width="484" height="54" rx="8" fill="#12251a" stroke="#3ecf8e"/>
  <text x="666" y="526" fill="#4ade80" font-family="Consolas,monospace" font-size="17" font-weight="700">Resultado: SUCESSO (17/17 etapas)</text>
