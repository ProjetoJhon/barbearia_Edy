  <text x="724" y="77" fill="#a7a9af" font-family="Consolas,monospace" font-size="13">PowerShell — test-supabase.mjs</text>

  <g font-family="Consolas,monospace" font-size="14">
    <text x="646" y="128" fill="#8b8e95">$env:SUPABASE_OWNER_EMAIL = "..."</text>
    <text x="646" y="156" fill="#8b8e95">$env:SUPABASE_ADMIN_EMAIL = "..."</text>
    <text x="646" y="184" fill="#8b8e95">node test-supabase.mjs</text>
